<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheerful Chat Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Chats</h2>
        </div>
        <div class="contact-list">
            <div class="contact">
                <div class="contact-avatar" style="background-color: #ff9999;"></div>
                <span>Bhumika</span>
            </div>
            <div class="contact">
                <div class="contact-avatar" style="background-color: #99ff99;"></div>
                <span>Suresh</span>
            </div>
            <div class="contact">
                <div class="contact-avatar" style="background-color: #9999ff;"></div>
                <span>Project Group</span>
            </div>
        </div>
    </div>
    <div class="main-chat">
        <div class="chat-header">
            <div class="contact-avatar" style="background-color: #ff9999; width: 35px; height: 35px; margin-right: 12px;"></div>
            <h3>Bhumika</h3>
        </div>
        <div class="chat-messages">
            <div class="message received">Hey, how's it going?</div>
            <div class="message sent">Pretty good! Working on that project. Designing the UI now!</div>
        </div>
        <div class="chat-input">
            <input type="text" placeholder="Type a message...">
            <button>➤</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
