<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Monthly Expenses</h1>
        <div class="input-group">
            <input type="text" id="expense-name" placeholder="Expense Name (e.g., Books)">
            <input type="number" id="expense-amount" placeholder="Amount (e.g., 50)">
            <button id="add-btn">Add</button>
        </div>
        <ul id="expense-list"></ul>
        <div class="total">Total: $<span id="total-amount">0</span></div>
    </div>
<script src="script.js"></script>
</body>
</html>
